[package]
name = "osu-skin-renamer"
version = "2.1.0"
edition = "2021"
description = "List and bulk-rename osu!lazer skins directly in the client.realm database"

[dependencies]
regex = "1.13.2"
rfd = "0.18.0"
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[build-dependencies]
cmake = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
