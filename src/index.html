<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>osu! skin renamer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1012;
      --surface: #151619;
      --raised: #1c1d21;
      --hover: #1e2024;
      --sel: #1f2638;
      --border: #24262b;
      --border-strong: #33363c;
      --text: #e6e7e9;
      --muted: #8b9098;
      --faint: #5f646c;
      --accent: #8ea6ff;
      --accent-ink: #0f1012;
      --danger: #f07a7d;
      --ok: #6ccf98;
      --ring: rgba(142, 166, 255, .22);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --surface: #ffffff;
        --raised: #ffffff;
        --hover: #f0f1f3;
        --sel: #e6ebff;
        --border: #e4e5e9;
        --border-strong: #d2d4da;
        --text: #1b1c1f;
        --muted: #6a6f78;
        --faint: #9ba0a8;
        --accent: #3b5bdb;
        --accent-ink: #ffffff;
        --danger: #d9363e;
        --ok: #1f9d55;
        --ring: rgba(59, 91, 219, .2);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    input:focus-visible { outline: none; }
    ::placeholder { color: var(--faint); }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid transparent; border-radius: 6px; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--faint); }

    /* ---- Toolbar ---- */
    header {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 48px;
      padding: 0 12px 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 13px; font-weight: 600; margin-right: 14px; white-space: nowrap; }
    header h1 span { color: var(--muted); font-weight: 400; }
    .search { position: relative; flex: 1; max-width: 360px; }
    .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    #search {
      width: 100%;
      height: 30px;
      padding: 0 10px 0 31px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      outline: none;
      user-select: text;
    }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    .spacer { flex: 1; }
    .sep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 4px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--raised);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, border-color .12s, color .12s;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.icon { width: 30px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); }
    .btn.icon:hover:not(:disabled) { color: var(--text); background: var(--hover); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
    #save { min-width: 76px; margin-left: 6px; }
    #save:disabled { opacity: 1; background: var(--raised); border-color: var(--border-strong); color: var(--faint); font-weight: 400; }
    #folder.attention { color: var(--accent); border-color: var(--accent); background: var(--sel); }

    /* ---- Skin list ---- */
    main { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .cols, .row { display: flex; align-items: center; gap: 16px; }
    .cols {
      height: 30px;
      flex-shrink: 0;
      padding: 0 16px 0 18px;
      border-bottom: 1px solid var(--border);
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .cols .c-name { flex: 1; }
    .cols .c-creator, .row .creator { width: 34%; max-width: 300px; flex-shrink: 0; }
    #list { flex: 1; overflow-y: auto; outline: none; padding: 4px 0; }
    .row { height: 32px; margin: 0 6px; padding: 0 10px 0 12px; border-radius: 6px; cursor: default; }
    .row:hover { background: var(--hover); }
    .row.selected { background: var(--sel); }
    #list:focus .row.selected { box-shadow: inset 2px 0 0 var(--accent); }
    .row.drop { background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent); }
    .row .name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 3px 7px;
      margin: -3px -7px;
      border-radius: 5px;
    }
    .row.dirty .name::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 8px 1px 0;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
    }
    .row .creator { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row input.editor {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 5px;
      padding: 3px 7px;
      margin: -3px -7px;
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
      user-select: text;
    }
    .empty { padding: 56px 24px; text-align: center; color: var(--faint); }

    /* ---- Tag sidebar ---- */
    #tags {
      width: 248px;
      flex-shrink: 0;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 14px 10px;
    }
    #tags h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 8px 6px; }
    #tags section + section { margin-top: 22px; }
    .tag { display: flex; align-items: center; gap: 2px; padding-right: 2px; border-radius: 6px; }
    .tag:hover { background: var(--hover); }
    .tag .apply {
      flex: 1;
      min-width: 0;
      height: 30px;
      padding: 0 8px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: none;
      border: 0;
      border-radius: 6px;
      cursor: grab;
    }
    .tag .apply.sel { background: var(--sel); color: var(--accent); font-weight: 600; }
    .tag .act {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 5px;
      background: none;
      color: var(--faint);
      cursor: pointer;
      opacity: 0;
    }
    .tag .act svg { width: 13px; height: 13px; }
    .tag:hover .act, .tag .act:focus-visible { opacity: 1; }
    .tag .act:hover { color: var(--text); background: var(--border); }
    .tag .act.del:hover { color: var(--danger); }
    .tag input, .add input {
      flex: 1;
      min-width: 0;
      height: 30px;
      padding: 0 8px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 6px;
      outline: none;
      user-select: text;
    }
    .add { display: flex; margin-top: 4px; }
    .add input { background: transparent; border: 1px dashed var(--border-strong); }
    .add input:hover { border-color: var(--faint); }
    .add input:focus { background: var(--bg); border: 1px solid var(--accent); }

    /* ---- Status bar ---- */
    footer {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 30px;
      padding: 0 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--ok); }
    #count { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---- Context menu + dialog ---- */
    #menu {
      position: fixed; z-index: 10; min-width: 168px; padding: 4px;
      background: var(--raised); border: 1px solid var(--border-strong); border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2);
    }
    #menu div { padding: 6px 10px; border-radius: 5px; cursor: default; }
    #menu div:hover { background: var(--hover); }
    #menu div[data-act="delete"] { color: var(--danger); }
    #menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
    #meta {
      margin: auto; width: 400px; padding: 20px; color: var(--text);
      background: var(--raised); border: 1px solid var(--border-strong); border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    #meta::backdrop { background: rgba(0,0,0,.45); }
    #meta h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    #meta label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    #meta input {
      display: block; width: 100%; height: 32px; margin-top: 5px; padding: 0 10px; font: inherit; font-size: 13px;
      color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 7px;
      outline: none; user-select: text;
    }
    #meta input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    #meta dl {
      display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; margin: 4px 0 20px;
      padding: 10px 12px; background: var(--bg); border-radius: 7px;
    }
    #meta dt { color: var(--faint); }
    #meta dd { color: var(--muted); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; user-select: text; overflow-wrap: anywhere; }
    #meta .buttons { display: flex; flex-direction: row-reverse; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>osu! <span>skin renamer</span></h1>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Filter by name or creator" spellcheck="false" />
    </label>
    <div class="spacer"></div>
    <button id="refresh" class="btn icon" title="Reload from database"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button id="folder" class="btn icon" title="osu! folder: auto-detected. Click to choose it yourself."><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <div class="sep"></div>
    <button id="undo" class="btn icon" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" class="btn icon" title="Redo (Ctrl+Y)" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button id="save" class="btn primary" title="Write all pending renames to osu! (Ctrl+S)" disabled>Save</button>
  </header>
  <main>
    <div class="pane">
      <div class="cols"><span class="c-name">Name</span><span class="c-creator">Creator</span></div>
      <div id="list" tabindex="0"></div>
    </div>
    <aside id="tags">
      <section>
        <h2>Prefix</h2>
        <div id="prefix-list"></div>
        <div class="add"><input id="prefix-add" placeholder="Add prefix…" spellcheck="false" /></div>
      </section>
      <section>
        <h2>Suffix</h2>
        <div id="suffix-list"></div>
        <div class="add"><input id="suffix-add" placeholder="Add suffix…" spellcheck="false" /></div>
      </section>
    </aside>
  </main>
  <footer><div id="status">Double-click or F2 to rename · right-click for more · Del deletes</div><div id="count"></div></footer>

  <div id="menu" hidden><div data-act="rename">Rename</div><div data-act="meta">Edit metadata…</div><hr /><div data-act="delete">Delete</div></div>
  <dialog id="meta">
    <form method="dialog">
      <h2>Skin metadata</h2>
      <label>Name <input name="name" required spellcheck="false" /></label>
      <label>Creator <input name="creator" spellcheck="false" /></label>
      <dl><dt>ID</dt><dd id="meta-id"></dd><dt>Type</dt><dd id="meta-type"></dd></dl>
      <div class="buttons">
        <!-- Apply first so Enter submits it; row-reverse puts it on the right. -->
        <button value="ok" class="btn primary">Apply</button>
        <button value="cancel" formnovalidate class="btn">Cancel</button>
      </div>
    </form>
  </dialog>
  <script>
    // Bridge to the Rust side (gui.rs): postMessage out, __reply back.
    const pending = new Map();
    let callId = 0;
    window.__reply = (id, ok, val) => {
      const p = pending.get(id);
      pending.delete(id);
      ok ? p.resolve(val) : p.reject(new Error(val));
    };
    const call = (cmd, ...args) => new Promise((resolve, reject) => {
      pending.set(++callId, { resolve, reject });
      window.ipc.postMessage(JSON.stringify({ id: callId, cmd, args }));
    });
    window.skins = {
      list: () => call("list"),
      save: (renames) => call("save", renames),
      getFolder: () => call("getFolder"),
      chooseFolder: () => call("chooseFolder"),
      delete: (id) => call("delete", id),
    };

    // Right-click menu; resolves with "rename" / "delete", or null when dismissed.
    const menuEl = document.getElementById("menu");
    function contextMenu(x, y) {
      return new Promise((resolve) => {
        menuEl.hidden = false;
        menuEl.style.left = Math.min(x, innerWidth - menuEl.offsetWidth) + "px";
        menuEl.style.top = Math.min(y, innerHeight - menuEl.offsetHeight) + "px";
        const close = (e) => {
          if (e.type === "keydown" && e.key !== "Escape") return;
          menuEl.hidden = true;
          removeEventListener("mousedown", close, true);
          removeEventListener("keydown", close, true);
          removeEventListener("blur", close);
          const act = e.type === "mousedown" && e.button === 0 && e.target.dataset ? e.target.dataset.act : null;
          setTimeout(() => resolve(act || null)); // after the mousedown that closed it
          if (act) e.stopPropagation();
        };
        addEventListener("mousedown", close, true);
        addEventListener("keydown", close, true);
        addEventListener("blur", close);
      });
    }

    // Window close button (sent by gui.rs): ask first if renames are unsaved.
    window.__tryClose = () => {
      if (!dirtySkins().length || confirm("You have unsaved renames. Close anyway and lose them?"))
        window.ipc.postMessage(JSON.stringify({ cmd: "quit" }));
    };

    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");

    // Named allSkins because contextBridge already defines window.skins,
    // and a top-level `let skins` would collide with it.
    let allSkins = [];     // [{id, name, creator}]
    let selectedId = null;
    let selectedIds = new Set();
    let editing = false;

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = cls || "";
    }

    function visibleSkins() {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) return allSkins;
      return allSkins.filter(
        (s) => s.name.toLowerCase().includes(q) || s.creator.toLowerCase().includes(q)
      );
    }

    function render() {
      const vis = visibleSkins();
      countEl.textContent = `${vis.length} / ${allSkins.length} skins`;
      renderTags();
      updateButtons();
      listEl.innerHTML = "";
      if (vis.length === 0) {
        listEl.innerHTML = '<div class="empty">No skins match.</div>';
        return;
      }
      for (const s of vis) {
        const row = document.createElement("div");
        row.className = "row" + (selectedIds.has(s.id) ? " selected" : "") + (isDirty(s) ? " dirty" : "");
        row.dataset.id = s.id;

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = s.name;
        name.title = s.name !== s.saved ? `${s.name}\n(unsaved — was "${s.saved}")` : s.name;

        const creator = document.createElement("div");
        creator.className = "creator";
        creator.textContent = s.creator ? "by " + s.creator : "";
        creator.title = s.creator !== s.savedCreator ? `${s.creator}\n(unsaved — was "${s.savedCreator}")` : s.creator;

        row.append(name, creator);
        row.addEventListener("mousedown", (e) => {
          if (e.button !== 0 && selectedIds.has(s.id)) return; // right-click keeps multi-selection
          select(s.id, e.ctrlKey || e.altKey);
        });
        // Drop a tag from the sidebar onto a skin to add it.
        row.addEventListener("dragover", (e) => {
          if (!e.dataTransfer.types.includes("application/x-skin-tag")) return;
          e.preventDefault();
          row.classList.add("drop");
        });
        row.addEventListener("dragleave", () => row.classList.remove("drop"));
        row.addEventListener("drop", (e) => {
          row.classList.remove("drop");
          const data = e.dataTransfer.getData("application/x-skin-tag");
          if (!data) return;
          e.preventDefault();
          const { kind, t } = JSON.parse(data);
          // Dropping onto one of several selected skins tags all of them.
          if (!selectedIds.has(s.id)) select(s.id);
          applyTag(kind, t, selectedSkins(), true);
        });
        name.addEventListener("dblclick", () => startEdit(row, s));
        row.addEventListener("contextmenu", async (ev) => {
          ev.preventDefault();
          if (editing) return;
          if (!selectedIds.has(s.id)) select(s.id);
          const action = await contextMenu(ev.clientX, ev.clientY);
          if (action === "rename") {
            startEdit(row, s);
          } else if (action === "meta") {
            editMetadata(s);
          } else if (action === "delete") {
            await deleteSkin(s);
          }
        });
        listEl.appendChild(row);
      }
    }

    // selectedId is the primary skin (F2 / Delete / arrows); selectedIds is
    // the whole selection, grown with Ctrl+click (or Alt+click).
    function select(id, add = false) {
      if (editing) return;
      if (!add) {
        selectedIds = new Set([id]);
        selectedId = id;
      } else if (selectedIds.has(id)) {
        selectedIds.delete(id);
        selectedId = selectedId === id ? [...selectedIds].pop() ?? null : selectedId;
      } else {
        selectedIds.add(id);
        selectedId = id;
      }
      for (const row of listEl.children) {
        if (row.classList) row.classList.toggle("selected", selectedIds.has(row.dataset.id));
      }
      if (selectedIds.size > 1) setStatus(`${selectedIds.size} skins selected — tags apply to all of them.`);
      renderTags();
    }

    const selectedSkins = () => allSkins.filter((s) => selectedIds.has(s.id));

    function startEdit(row, skin) {
      if (editing) return;
      editing = true;
      select(skin.id);

      const nameEl = row.querySelector(".name");
      const input = document.createElement("input");
      input.className = "editor";
      input.value = skin.name;
      input.spellcheck = false;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      let done = false;
      const finish = (commit) => {
        if (done) return;
        done = true;
        const newName = input.value.trim();
        if (commit && newName) renameSkin(skin, newName);
        editing = false;
        render();
        listEl.focus();
      };

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        else if (e.key === "Escape") finish(false);
        e.stopPropagation();
      });
      input.addEventListener("blur", () => finish(true));
    }

    const errMsg = (e) => e.message.replace(/^Error invoking remote method '[^']+': (Error: )?/, "");

    // ---- Metadata editor (right-click → Edit metadata…) ----
    const metaEl = document.getElementById("meta");
    let metaSkin = null;
    function editMetadata(skin) {
      metaSkin = skin;
      metaEl.querySelector('[name="name"]').value = skin.name;
      metaEl.querySelector('[name="creator"]').value = skin.creator;
      document.getElementById("meta-id").textContent = skin.id;
      document.getElementById("meta-type").textContent = skin.type || "—";
      editing = true;
      metaEl.showModal();
    }
    metaEl.addEventListener("close", () => {
      editing = false;
      const f = new FormData(metaEl.querySelector("form"));
      if (metaEl.returnValue === "ok" && metaSkin) {
        const name = f.get("name").trim();
        changeMany([
          ...(name ? [[metaSkin, "name", name]] : []),
          [metaSkin, "creator", f.get("creator").trim()],
        ]);
      }
      metaEl.returnValue = "";
      metaSkin = null;
      listEl.focus();
    });

    // ---- Pending changes + undo/redo ----
    // Edits only change skin.name / skin.creator locally; skin.saved /
    // skin.savedCreator are what's in the DB. Save writes every changed skin in one batch.
    let undoStack = [];   // [[{id, field, from, to}, …]] — one entry per user action
    let redoStack = [];
    const isDirty = (s) => s.name !== s.saved || s.creator !== s.savedCreator;
    const dirtySkins = () => allSkins.filter(isDirty);

    function updateButtons() {
      const n = dirtySkins().length;
      document.getElementById("undo").disabled = !undoStack.length;
      document.getElementById("redo").disabled = !redoStack.length;
      const save = document.getElementById("save");
      save.disabled = !n;
      save.textContent = n ? `Save ${n}` : "Save";
    }

    function setField(a, key) {
      const skin = allSkins.find((s) => s.id === a.id);
      if (skin) skin[a.field] = a[key];
    }

    const renameSkin = (skin, newName) => renameMany([[skin, newName]]);
    const renameMany = (pairs) => changeMany(pairs.map(([s, n]) => [s, "name", n]));

    // changes: [[skin, field, value], …] — recorded as a single undo step.
    function changeMany(changes) {
      const action = changes
        .filter(([s, f, v]) => v !== s[f])
        .map(([s, f, v]) => ({ id: s.id, field: f, from: s[f], to: v }));
      if (!action.length) return;
      undoStack.push(action);
      redoStack = [];
      for (const a of action) setField(a, "to");
      const n = new Set(action.map((a) => a.id)).size;
      setStatus(
        (action.length === 1 ? `"${action[0].to}"` : `${n} skin(s) changed`) +
          " — unsaved, press Save (Ctrl+S) to write to osu!"
      );
      render();
    }

    const describe = (action, key) =>
      action.length === 1 ? `"${action[0][key]}"` : `${new Set(action.map((a) => a.id)).size} skin(s)`;

    function undo() {
      const action = undoStack.pop();
      if (!action) return;
      for (const a of action) setField(a, "from");
      redoStack.push(action);
      setStatus(`Undid → ${describe(action, "from")}`);
      render();
    }

    function redo() {
      const action = redoStack.pop();
      if (!action) return;
      for (const a of action) setField(a, "to");
      undoStack.push(action);
      setStatus(`Redid → ${describe(action, "to")}`);
      render();
    }

    async function save() {
      const dirty = dirtySkins();
      if (!dirty.length || editing) return;
      editing = true;
      setStatus(`Saving ${dirty.length} change(s)…`);
      try {
        const res = await window.skins.save(dirty.map((s) => ({ id: s.id, name: s.name, creator: s.creator })));
        for (const s of dirty) { s.saved = s.name; s.savedCreator = s.creator; }
        setStatus(`Saved ${res.renamed} change(s).` + (res.backup ? `  (backup: ${res.backup})` : ""), "ok");
      } catch (e) {
        setStatus(errMsg(e), "error");
      }
      editing = false;
      render();
    }

    window.addEventListener("beforeunload", (e) => {
      if (dirtySkins().length) e.returnValue = false;
    });

    // ---- Prefix / suffix tags (stored in localStorage) ----
    const tags = { prefix: [], suffix: [] };
    let selectedTag = null;   // {kind, t} — last clicked tag, shown with a pink outline
    try { Object.assign(tags, JSON.parse(localStorage.getItem("tags")) || {}); } catch {}
    const saveTags = () => { try { localStorage.setItem("tags", JSON.stringify(tags)); } catch {} };

    const hasTag = (name, kind, t) =>
      kind === "prefix" ? name.startsWith(t + " ") : name.endsWith(" " + t);

    // Toggle: adds the tag if missing, strips it if present.
    function toggledName(name, kind, t) {
      if (hasTag(name, kind, t))
        return kind === "prefix" ? name.slice(t.length + 1) : name.slice(0, -(t.length + 1));
      return kind === "prefix" ? `${t} ${name}` : `${name} ${t}`;
    }

    // Click toggles on the selected skins; drop (addOnly) only adds.
    // With several skins: add to those missing it; if all have it, remove from all.
    function applyTag(kind, t, skins = selectedSkins(), addOnly = false) {
      if (!skins.length) return setStatus("Select a skin first.", "error");
      if (editing) return;
      const missing = skins.filter((s) => !hasTag(s.name, kind, t));
      if (addOnly && !missing.length)
        return setStatus(skins.length === 1 ? `"${skins[0].name}" already has "${t}".` : `All selected skins already have "${t}".`);
      const targets = missing.length ? missing : skins;
      renameMany(targets.map((s) => [s, toggledName(s.name, kind, t)]));
    }

    function renderTags() {
      for (const kind of ["prefix", "suffix"]) {
        const box = document.getElementById(kind + "-list");
        box.innerHTML = "";
        tags[kind].forEach((t, i) => {
          const row = document.createElement("div");
          row.className = "tag";
          const apply = document.createElement("button");
          apply.className = "apply" + (selectedTag && selectedTag.kind === kind && selectedTag.t === t ? " sel" : "");
          apply.textContent = t;
          apply.title = `Drag onto a skin to add "${t}", or click to toggle it on the selected skin`;
          apply.onclick = () => { selectedTag = { kind, t }; applyTag(kind, t); renderTags(); };
          apply.draggable = true;
          apply.ondragstart = (e) => {
            e.dataTransfer.setData("application/x-skin-tag", JSON.stringify({ kind, t }));
            e.dataTransfer.effectAllowed = "copy";
          };
          const edit = document.createElement("button");
          edit.className = "act";
          edit.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
          edit.title = "Edit tag";
          edit.onclick = () => {
            const input = document.createElement("input");
            input.value = t;
            input.spellcheck = false;
            apply.replaceWith(input);
            input.focus();
            input.select();
            let done = false;
            const finish = (commit) => {
              if (done) return;
              done = true;
              const v = input.value.trim();
              if (commit && v) { tags[kind][i] = v; saveTags(); selectedTag = null; }
              renderTags();
            };
            input.onkeydown = (e) => {
              if (e.key === "Enter") finish(true);
              else if (e.key === "Escape") finish(false);
              e.stopPropagation();
            };
            input.onblur = () => finish(true);
          };
          const del = document.createElement("button");
          del.className = "act del";
          del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
          del.title = "Remove tag";
          del.onclick = () => { tags[kind].splice(i, 1); saveTags(); selectedTag = null; renderTags(); };
          row.append(apply, edit, del);
          box.appendChild(row);
        });
      }
    }

    // Clicking empty space in the tag panel drops focus from the last-clicked tag.
    document.getElementById("tags").addEventListener("mousedown", (e) => {
      if (!e.target.closest("button, input")) { selectedTag = null; renderTags(); }
    });

    for (const kind of ["prefix", "suffix"]) {
      const input = document.getElementById(kind + "-add");
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        const v = input.value.trim();
        if (e.key !== "Enter" || !v) return;
        if (!tags[kind].includes(v)) { tags[kind].push(v); saveTags(); }
        input.value = "";
        renderTags();
      });
    }

    async function deleteSkin(skin) {
      if (!confirm(`Delete skin "${skin.name}"?\n\nThe skin is marked for deletion and disappears when osu! next starts. A backup of client.realm is created first.`)) return;
      try {
        const res = await window.skins.delete(skin.id);
        allSkins = allSkins.filter((s) => s.id !== skin.id);
        const dropSkin = (stack) => stack.map((act) => act.filter((a) => a.id !== skin.id)).filter((act) => act.length);
        undoStack = dropSkin(undoStack);
        redoStack = dropSkin(redoStack);
        selectedIds.delete(skin.id);
        if (selectedId === skin.id) selectedId = null;
        render();
        setStatus(`Deleted "${res.name}" — osu! removes it on next start.  (backup: ${res.backup})`, "ok");
      } catch (e) {
        setStatus(e.message.replace(/^Error invoking remote method '[^']+': (Error: )?/, ""), "error");
      }
    }

    const folderBtn = document.getElementById("folder");

    async function refresh(skipConfirm = false) {
      if (!skipConfirm && dirtySkins().length && !confirm("Discard unsaved renames and reload from the database?")) return;
      setStatus("Loading skins…");
      undoStack = [];
      redoStack = [];
      const custom = await window.skins.getFolder();
      folderBtn.title = custom
        ? `osu! folder: ${custom}\nClick to choose a different one.`
        : "osu! folder: auto-detected. Click to choose it yourself.";
      try {
        allSkins = (await window.skins.list()).map((s) => ({ ...s, saved: s.name, savedCreator: s.creator }));
        folderBtn.classList.remove("attention");
        render();
        setStatus("Double-click or F2 to rename · right-click for more · Del deletes");
      } catch (e) {
        allSkins = [];
        render();
        const msg = errMsg(e);
        const notFound = /database not found/i.test(msg);
        folderBtn.classList.toggle("attention", notFound);
        setStatus(notFound ? `${msg} — click the folder button (top right) to choose where osu! keeps its data.` : msg, "error");
      }
    }

    async function chooseFolder() {
      if (dirtySkins().length && !confirm("Discard unsaved renames and switch osu! folder?")) return;
      try {
        if (await window.skins.chooseFolder()) refresh(true);
      } catch (e) {
        setStatus(errMsg(e), "error");
      }
    }

    // Keyboard: F2 to rename, arrows to move selection (Explorer-style).
    document.addEventListener("keydown", (e) => {
      if (editing) return;
      const vis = visibleSkins();
      const k = e.key.toLowerCase();
      if (e.ctrlKey && k === "s") {
        save();
        e.preventDefault();
      } else if (e.ctrlKey && document.activeElement.tagName !== "INPUT" && (k === "y" || (k === "z" && e.shiftKey))) {
        redo();
        e.preventDefault();
      } else if (e.ctrlKey && k === "z" && document.activeElement.tagName !== "INPUT") {
        undo();
        e.preventDefault();
      } else if (e.key === "F2" && selectedId) {
        const row = [...listEl.children].find((r) => r.dataset && r.dataset.id === selectedId);
        const skin = allSkins.find((s) => s.id === selectedId);
        if (row && skin) startEdit(row, skin);
        e.preventDefault();
      } else if (e.key === "Delete" && selectedId && document.activeElement.tagName !== "INPUT") {
        const skin = allSkins.find((s) => s.id === selectedId);
        if (skin) deleteSkin(skin);
        e.preventDefault();
      } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && vis.length && document.activeElement.tagName !== "INPUT") {
        let idx = vis.findIndex((s) => s.id === selectedId);
        idx = e.key === "ArrowDown" ? Math.min(idx + 1, vis.length - 1) : Math.max(idx - 1, 0);
        select(vis[idx].id);
        const row = [...listEl.children].find((r) => r.dataset && r.dataset.id === selectedId);
        if (row) row.scrollIntoView({ block: "nearest" });
        e.preventDefault();
      }
    });

    searchEl.addEventListener("input", render);
    document.getElementById("refresh").addEventListener("click", () => refresh());
    folderBtn.addEventListener("click", chooseFolder);
    document.getElementById("undo").addEventListener("click", undo);
    document.getElementById("redo").addEventListener("click", redo);
    document.getElementById("save").addEventListener("click", save);
    refresh();
  </script>
</body>
</html>
